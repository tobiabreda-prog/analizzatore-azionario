name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Trova la cartella del progetto
        run: |
          echo "Contenuto del repository:"
          find . -maxdepth 3 -not -path "./.git/*" -not -path "*/node_modules/*" | sort
          PKG=$(find . -name package.json -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$PKG" ]; then
            echo "::error::package.json non trovato nel repository: i file non sono stati caricati correttamente."
            exit 1
          fi
          APP_DIR=$(dirname "$PKG")
          echo "Cartella progetto: $APP_DIR"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          for f in index.html vite.config.js tailwind.config.js postcss.config.js capacitor.config.json src/main.jsx src/App.jsx src/index.css; do
            [ -f "$APP_DIR/$f" ] || { echo "::error::File mancante: $f"; exit 1; }
          done

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Prepara Android SDK (gia' presente sul runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" || true
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          echo "Licenze gestite"

      # Mantiene la stessa chiave di firma tra una build e l'altra,
      # cosi' il nuovo APK si installa sopra quello vecchio senza disinstallare.
      - name: Ripristina chiave di firma
        id: keystore
        uses: actions/cache@v5
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: Installa dipendenze
        working-directory: ${{ env.APP_DIR }}
        run: npm install --no-audit --no-fund

      - name: Build web
        working-directory: ${{ env.APP_DIR }}
        run: npm run build

      - name: Aggiungi piattaforma Android
        working-directory: ${{ env.APP_DIR }}
        run: |
          npx cap add android
          npx cap sync android

      - name: Compila APK
        working-directory: ${{ env.APP_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Impronta della chiave di firma
        run: |
          echo "Chiave ripristinata dalla cache: ${{ steps.keystore.outputs.cache-hit }}"
          keytool -list -keystore ~/.android/debug.keystore -storepass android 2>/dev/null | grep -i "SHA" || echo "Chiave non trovata"

      - uses: actions/upload-artifact@v5
        with:
          name: analizzatore-azionario-apk
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
