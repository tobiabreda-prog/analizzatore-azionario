name: Build APK
on:
  workflow_dispatch:

concurrency:
  group: manual-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Trova la cartella del progetto
        run: |
          echo "Contenuto del repository:"
          find . -maxdepth 3 -not -path "./.git/*" -not -path "*/node_modules/*" | sort
          PKG=$(find . -name package.json -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$PKG" ]; then
            echo "::error::package.json non trovato nel repository: i file non sono stati caricati correttamente."
            exit 1
          fi
          APP_DIR=$(dirname "$PKG")
          echo "Cartella progetto: $APP_DIR"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          for f in index.html vite.config.js tailwind.config.js postcss.config.js capacitor.config.json src/main.jsx src/App.jsx src/index.css; do
            [ -f "$APP_DIR/$f" ] || { echo "::error::File mancante: $f"; exit 1; }
          done

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Prepara Android SDK (gia' presente sul runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" || true
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          echo "Licenze gestite"

      - name: Restore permanent Android debug signing key
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_DEBUG_KEYSTORE_BASE64:-}" ]]; then
            echo "::error::Missing ANDROID_DEBUG_KEYSTORE_BASE64. Refusing to generate an APK signed with a new random key."
            exit 1
          fi
          install -d -m 700 "$HOME/.android"
          printf %s "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey > /dev/null
          echo "Permanent Android signing key loaded and validated."

      - name: Installa dipendenze
        working-directory: ${{ env.APP_DIR }}
        run: npm install --no-audit --no-fund

      - name: Build web
        working-directory: ${{ env.APP_DIR }}
        run: npm run build

      - name: Aggiungi piattaforma Android
        working-directory: ${{ env.APP_DIR }}
        run: |
          npx cap add android
          npx cap sync android

      - name: Genera icone Android personalizzate
        working-directory: ${{ env.APP_DIR }}
        run: node scripts/generate-android-icons.mjs

      - name: Stampa report su Android (plugin nativo)
        working-directory: ${{ env.APP_DIR }}
        run: |
          MAIN=$(find android/app/src/main/java -name MainActivity.java | head -n 1)
          if [ -z "$MAIN" ]; then echo "::error::MainActivity.java non trovato"; exit 1; fi
          DIR=$(dirname "$MAIN")
          PKG=$(grep -m1 '^package ' "$MAIN" | sed 's/^package \(.*\);.*/\1/')
          echo "Pacchetto Android: $PKG"
          cat > "$DIR/PrintReportPlugin.java" <<'JAVA'
          package __PKG__;

          import android.content.Context;
          import android.print.PrintAttributes;
          import android.print.PrintDocumentAdapter;
          import android.print.PrintManager;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "PrintReport")
          public class PrintReportPlugin extends Plugin {

              // Riferimento tenuto vivo finche' la finestra di stampa e' aperta
              private WebView printWebView;

              @PluginMethod
              public void print(final PluginCall call) {
                  final String html = call.getString("html", "");
                  final String name = call.getString("name", "Report");
                  if (html == null || html.isEmpty()) {
                      call.reject("Report vuoto");
                      return;
                  }
                  getActivity().runOnUiThread(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              final WebView web = new WebView(getActivity());
                              web.getSettings().setJavaScriptEnabled(false);
                              web.setWebViewClient(new WebViewClient() {
                                  private boolean done = false;

                                  @Override
                                  public void onPageFinished(WebView view, String url) {
                                      if (done) return;
                                      done = true;
                                      try {
                                          PrintManager pm = (PrintManager) getActivity().getSystemService(Context.PRINT_SERVICE);
                                          PrintDocumentAdapter adapter = view.createPrintDocumentAdapter(name);
                                          PrintAttributes attrs = new PrintAttributes.Builder()
                                                  .setMediaSize(PrintAttributes.MediaSize.ISO_A4)
                                                  .build();
                                          pm.print(name, adapter, attrs);
                                          JSObject res = new JSObject();
                                          res.put("started", true);
                                          call.resolve(res);
                                      } catch (Exception e) {
                                          call.reject("Impossibile aprire la finestra di stampa: " + e.getMessage());
                                      }
                                  }
                              });
                              printWebView = web;
                              web.loadDataWithBaseURL(null, html, "text/html", "UTF-8", null);
                          } catch (Exception e) {
                              call.reject("Errore di stampa: " + e.getMessage());
                          }
                      }
                  });
              }
          }
          JAVA
          cat > "$DIR/MainActivity.java" <<'JAVA'
          package __PKG__;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(PrintReportPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA
          sed -i "s/__PKG__/$PKG/g" "$DIR/PrintReportPlugin.java" "$DIR/MainActivity.java"
          grep -n "registerPlugin" "$DIR/MainActivity.java"

      - name: Compila APK
        working-directory: ${{ env.APP_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Impronta della chiave di firma
        run: |
          echo "Chiave di firma permanente ripristinata dal secret GitHub."
          keytool -list -keystore ~/.android/debug.keystore -storepass android 2>/dev/null | grep -i "SHA" || echo "Chiave non trovata"

      - uses: actions/upload-artifact@v5
        with:
          name: analizzatore-azionario-apk
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
