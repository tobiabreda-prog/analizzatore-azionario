name: Android debug APK
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      # Il cache di Actions non è un archivio affidabile per le chiavi private.
      # Il vecchio workflow non ha mai salvato debug.keystore (Path Validation Error).
      # Ripristinare la chiave ORIGINALE tramite GitHub Actions secret.
      - name: Restore original Android signing key
        shell: bash
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Manca il secret ANDROID_DEBUG_KEYSTORE_BASE64. Non è possibile firmare un aggiornamento compatibile con l'app installata."
            echo "::error::Recuperare il file debug.keystore ORIGINALE dalla macchina che ha firmato l'APK installata e salvarlo come secret base64. NON generare una nuova chiave."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
      - name: Verify existing signing identity before build
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$HOME/.android/debug.keystore"
          if [ ! -s "$KEYSTORE" ]; then
            echo "::error::Chiave di firma originale assente. Ripristinare ANDROID_DEBUG_KEYSTORE_BASE64; NON disinstallare la app."
            echo "::error::La chiave privata non è recuperabile da una APK. Non è sicuro generare una nuova firma."
            exit 1
          fi
          keytool -list -v -keystore "$KEYSTORE" -storepass android -alias androiddebugkey -keypass android | grep -E 'SHA256:|Alias name:' | head -n 2
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build web app
        run: npm run build
      - name: Add Android platform
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Generate custom Android launcher icons
        run: node scripts/generate-android-icons.mjs
      - name: Register native Android report printer
        run: |
          MAIN=$(find android/app/src/main/java -name MainActivity.java | head -n 1)
          if [ -z "$MAIN" ]; then echo "::error::MainActivity.java non trovato"; exit 1; fi
          DIR=$(dirname "$MAIN")
          PKG=$(grep -m1 '^package ' "$MAIN" | sed 's/^package \(.*\);.*/\1/')
          cat > "$DIR/PrintReportPlugin.java" <<'JAVA'
          package __PKG__;

          import android.content.Context;
          import android.print.PrintAttributes;
          import android.print.PrintDocumentAdapter;
          import android.print.PrintManager;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "PrintReport")
          public class PrintReportPlugin extends Plugin {
              private WebView printWebView;
              @PluginMethod
              public void print(final PluginCall call) {
                  final String html = call.getString("html", "");
                  final String name = call.getString("name", "Report");
                  if (html == null || html.isEmpty()) { call.reject("Report vuoto"); return; }
                  getActivity().runOnUiThread(new Runnable() {
                      @Override public void run() {
                          try {
                              final WebView web = new WebView(getActivity());
                              web.getSettings().setJavaScriptEnabled(false);
                              web.setWebViewClient(new WebViewClient() {
                                  private boolean done = false;
                                  @Override public void onPageFinished(WebView view, String url) {
                                      if (done) return;
                                      done = true;
                                      try {
                                          PrintManager pm = (PrintManager) getActivity().getSystemService(Context.PRINT_SERVICE);
                                          PrintDocumentAdapter adapter = view.createPrintDocumentAdapter(name);
                                          PrintAttributes attrs = new PrintAttributes.Builder().setMediaSize(PrintAttributes.MediaSize.ISO_A4).build();
                                          pm.print(name, adapter, attrs);
                                          JSObject res = new JSObject(); res.put("started", true); call.resolve(res);
                                      } catch (Exception e) { call.reject("Impossibile aprire la stampa: " + e.getMessage()); }
                                  }
                              });
                              printWebView = web;
                              web.loadDataWithBaseURL(null, html, "text/html", "UTF-8", null);
                          } catch (Exception e) { call.reject("Errore di stampa: " + e.getMessage()); }
                      }
                  });
              }
          }
          JAVA
          cat > "$DIR/MainActivity.java" <<'JAVA'
          package __PKG__;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
              @Override public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(PrintReportPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA
          sed -i "s/__PKG__/$PKG/g" "$DIR/PrintReportPlugin.java" "$DIR/MainActivity.java"
      - name: Assemble debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v5
        with:
          name: analizzatore-azionario-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
